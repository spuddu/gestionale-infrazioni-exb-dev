name: Deploy GII to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-gii-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject GII build into published app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path('docs/index.html')
          if not index.is_file():
              raise SystemExit('docs/index.html non trovato')

          html = index.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA'][:7]
          script = f'<script id="gii-build">window.__GII_BUILD__="{build}";</script>'

          # Rende il passaggio idempotente in caso di esecuzione manuale/ripetuta.
          html = re.sub(r'<script id="gii-build">.*?</script>', '', html, flags=re.S)

          if '</head>' not in html:
              raise SystemExit('Tag </head> non trovato in docs/index.html')

          html = html.replace('</head>', f'{script}</head>', 1)
          index.write_text(html, encoding='utf-8')
          print(f'GII build iniettata: {build}')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
